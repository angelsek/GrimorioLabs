name: Release module

# Two ways to trigger a release for a module folder:
#   1. Push a tag "<ModuleFolder>-v<version>" e.g. "Race_Creator-v0.1.0".
#   2. Run this workflow manually (Actions tab, or the GitHub API) with the
#      "module" and "version" inputs — useful when tag pushes aren't available.
# Either way, "<ModuleFolder>" must match a top-level folder in this repo
# containing that module's module.json. The result is a GitHub Release with
# two assets: module.json (for Foundry's manifest URL) and
# <ModuleFolder>.zip (for the download URL) — never a whole-repo zip, since
# that would mix in other modules' files.

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      module:
        description: "Carpeta del módulo (ej. Race_Creator)"
        required: true
      version:
        description: "Versión, sin la 'v' (ej. 0.1.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No hace git push: la Release la crea la API con GITHUB_TOKEN.
          persist-credentials: false

      - name: Resolve module folder and tag
        id: module
        # Los inputs y el nombre del tag llegan por env, nunca interpolados en el script:
        # así un valor con comillas o $(...) no se ejecuta como código.
        env:
          INPUT_MODULE: ${{ inputs.module }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            FOLDER="$INPUT_MODULE"
            TAG="${FOLDER}-v${INPUT_VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            FOLDER="${TAG%-v*}"
          fi
          # Solo nombres de carpeta y versiones simples (sin rutas ni caracteres de shell).
          if ! [[ "$FOLDER" =~ ^[A-Za-z0-9_.-]+$ ]] || [[ "$FOLDER" == .* ]] || ! [[ "$TAG" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Nombre de módulo o versión no válido: $TAG"
            exit 1
          fi
          if [ ! -f "$FOLDER/module.json" ]; then
            echo "::error::No se encontró $FOLDER/module.json para $TAG"
            exit 1
          fi
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        env:
          FOLDER: ${{ steps.module.outputs.folder }}
        run: |
          cd "$FOLDER"
          zip -r "../$FOLDER.zip" . -x "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.module.outputs.tag }}
          name: "${{ steps.module.outputs.folder }} ${{ steps.module.outputs.tag }}"
          files: |
            ${{ steps.module.outputs.folder }}.zip
            ${{ steps.module.outputs.folder }}/module.json
